Syntax 4

LibraryConfig.agm.Config {
        pcm.agm {
                @args [ CARD DEV ]
                        @args.CARD {
                        type integer
                        default 100
                }
                @args.DEV {
                        type integer
                        default 101
                }
                type agm
                card $CARD
                device $DEV
        }

        ctl.agm {
                type agm
                card 100
        }
}

SectionUseCase."DACPlayback" {
        File "DACPlayback.conf"
}

SectionUseCase."A2B2Playback" {
        File "A2B2Playback.conf"
}

SectionUseCase."A2B1Playback" {
        File "A2B1Playback.conf"
}

SectionUseCase."ADCRecord" {
        File "ADCRecord.conf"
}

SectionUseCase."A2B2Record" {
        File "A2B2Record.conf"
}

SectionUseCase."A2B1Record" {
        File "A2B1Record.conf"
}
