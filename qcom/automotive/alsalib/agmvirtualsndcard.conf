Syntax 4

LibraryConfig.agm.Config {
        pcm.agm {
                @args [ CARD DEV ]
                        @args.CARD {
                        type integer
                        default 100
                }
                @args.DEV {
                        type integer
                        default 101
                }
                type agm
                card $CARD
                device $DEV
        }

        ctl.agm {
                type agm
                card 100
        }
}

SectionUseCase."DACPlayback" {
        File "DACPlayback.conf"
}

SectionUseCase."A2BPlayback" {
        File "A2BPlayback.conf"
}

SectionUseCase."ADCRecord" {
        File "ADCRecord.conf"
}

SectionUseCase."A2BRecord" {
        File "A2BRecord.conf"
}
