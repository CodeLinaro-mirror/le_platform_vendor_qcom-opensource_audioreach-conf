Syntax 2

SectionVerb {
        EnableSequence [
            cdev "agm"
            cset "iface=MIXER,name='PCM_RT_PROXY-RX-2 rate ch fmt' 0xbb80,0x10,0x2,0x1"
            cset "iface=MIXER,name='PCM104 control' ZERO"
            cset-tlv "iface=MIXER,name='PCM104 metadata' /etc/DACStream_md.bin"
            cset-tlv "iface=MIXER,name='PCM_RT_PROXY-RX-2 metadata' /etc/DACDevice_md.bin"
            cset "iface=MIXER,name='PCM104 control' PCM_RT_PROXY-RX-2"
            cset "iface=MIXER,name='PCM104 connect' PCM_RT_PROXY-RX-2"
        ]
        DisableSequence [
        ]

        Value {
                PlaybackPCM "agm:100,104"
        }
}

SectionDevice."Speaker" {
        EnableSequence [
        ]

        DisableSequence [
        ]

        Value {
                PlaybackChannels "16"
        }
}
