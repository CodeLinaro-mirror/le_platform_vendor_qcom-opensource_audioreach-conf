Syntax 2

SectionVerb {
        EnableSequence [
            cdev "agm"
            cset     "iface=MIXER,name='PCM_RT_PROXY-TX-2 rate ch fmt' 0xbb80,0x8,0x2,0x1"
            cset     "iface=MIXER,name='PCM101 control' ZERO"
            cset-tlv "iface=MIXER,name='PCM101 metadata' /etc/A2B_record_stream_md.bin"
            cset-tlv "iface=MIXER,name='PCM_RT_PROXY-TX-2 metadata' /etc/A2B_record_device_md.bin"
            cset     "iface=MIXER,name='PCM101 control' PCM_RT_PROXY-TX-2"
            cset-tlv "iface=MIXER,name='PCM101 metadata' /etc/A2B_record_stream_device_md.bin"
            cset     "iface=MIXER,name='PCM101 connect' PCM_RT_PROXY-TX-2"
            ]
        DisableSequence [
        ]

        Value {
                CapturePCM "agm:100,101"
        }
}

SectionDevice."Mic" {
        EnableSequence [
        ]

        DisableSequence [
        ]

        Value {
                CaptureChannels "8"
        }
}