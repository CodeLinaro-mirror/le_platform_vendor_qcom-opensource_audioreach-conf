Syntax 4

LibraryConfig.agm.Config {
        pcm.agm {
                @args [ CARD DEV ]
                        @args.CARD {
                        type integer
                        default 100
                }
                @args.DEV {
                        type integer
                        default 101
                }
                type agm
                card $CARD
                device $DEV
        }

        ctl.agm {
                type agm
                card 100
        }
}

SectionUseCase."gain_0" {
        File "gain_0.conf"
}

SectionUseCase."gain_2000" {
        File "gain_2000.conf"
}

SectionUseCase."volume_0" {
        File "volume_0.conf"
}

SectionUseCase."volume_15" {
        File "volume_15.conf"
}

SectionUseCase."mute" {
        File "mute.conf"
}

SectionUseCase."unmute" {
        File "unmute.conf"
}